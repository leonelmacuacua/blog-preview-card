<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width = device-width, initial-scale = 1.0">
        <title>Blog Preview Card</title>
        <link rel = "stylesheet" href = "css/style.css">
    </head>

    <body>
        <main>
            <article class = "blog-card">
                <div class = "card-image-wrapper">
                    <img src = "assets/images/illustration-article.svg" alt = "HTML and CSS abstract illustration" class = "card-image">
                </div>

                <div class = "card-content">
                    <span class = "card-badge">Learning</span>
                    <time datetime = "2023-12-21" class = "card-date">Published 21 Dec 2023</time>

                    <h1 class = "card-title">HTML & CSS foundations</h1>
                    <p class = "card-description">
                        These languages are the backbone of every website, 
                        defining structure, content, and presentation.
                    </p>
                </div>

                <footer class = "card-author">
                    <img src = "assets/images/image-avatar.webp" alt = "author image profile" class = "author-avatar">
                    <span class = "author-name">Greg Hooper</span>
                </footer>
            </article>
        </main>
    </body>
</html>
